{# Historique d'exécution Hermes (`hermes cron runs`), chargé après la page de détail. #}
{% if runs %}
<section class="card">
  <h2>Historique d'exécution (Hermes)</h2>
  <table class="list">
    <thead><tr><th>Date</th><th>Statut</th><th>Origine</th><th>Erreur</th></tr></thead>
    <tbody>
    {% for r in runs %}<tr><td>{{ r.at|dt }}</td><td>{{ r.status }}</td><td>{{ r.source }}</td><td class="small">{{ r.error or "" }}</td></tr>{% endfor %}
    </tbody>
  </table>
</section>
{% endif %}
