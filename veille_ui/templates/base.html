<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false}'>
  <title>{% block title %}Veilles{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
  <header class="top">
    <a class="brand" href="/">Veilles</a>
    {% if csrf %}
    <nav>
      <a href="/">Tableau de bord</a>
      <a href="/veilles/new">Nouvelle veille</a>
      <a href="/sources">Sources</a>
      <a href="/health">Santé</a>
      <form method="post" action="/logout" class="inline">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="link">Déconnexion</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% if flash %}<p class="flash ok">{{ flash }}</p>{% endif %}
    {% if error %}<p class="flash err">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="foot muted small">veille-hermes v{{ VERSION }}</footer>
</body>
</html>
