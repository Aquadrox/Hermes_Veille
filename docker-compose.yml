# veille-hermes — déploiement en une commande
#
#   docker compose up -d          (après avoir rempli .env depuis .env.example)
#
# Le conteneur fait tourner le gateway Hermes (dont dépend le scheduler cron)
# et n'expose aucun port : il n'a besoin que d'accès sortants (recherche web,
# API DeepSeek, API Brevo).
services:
  veille:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HERMES_BASE: ${HERMES_BASE:-nousresearch/hermes-agent:latest}
    image: ${IMAGE:-ghcr.io/aquadrox/hermes-veille}:${IMAGE_TAG:-latest}
    container_name: veille-hermes
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Europe/Paris
      # UID/GID de l'hôte propriétaire du volume ./data (évite « Permission denied »)
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
    volumes:
      # Source de vérité de tout l'état : config, secrets, skills, cron, rapports.
      - ./data:/opt/data
    command: ["gateway", "run"]
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
