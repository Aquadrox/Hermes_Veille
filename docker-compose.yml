# veille-hermes — déploiement en une commande
#
#   docker compose up -d          (après avoir rempli .env depuis .env.example)
#
# Le conteneur fait tourner le gateway Hermes (dont dépend le scheduler cron) et
# l'interface web de gestion des veilles. L'interface n'est publiée que sur
# 127.0.0.1 de l'hôte : on y accède par tunnel SSH, jamais depuis le réseau.
services:
  veille:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE:-ghcr.io/aquadrox/hermes-veille}:${IMAGE_TAG:-latest}
    container_name: veille-hermes
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Europe/Paris
      # UID/GID de l'hôte propriétaire du dossier de données (évite « Permission denied »)
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
    volumes:
      # Source de vérité de tout l'état : config, skills, cron, historique, veilles, rapports.
      # Dossier de l'HÔTE, de préférence hors du dépôt (VEILLE_DATA_DIR, voir .env.example) :
      # une mise à jour (git pull, nouvelle image) ne le touche jamais. S'il est absent, le
      # démarrage ÉCHOUE au lieu de repartir d'un dossier vide (première installation :
      # ./scripts/deploy.sh --init).
      - type: bind
        source: ${VEILLE_DATA_DIR:-./data}
        target: /opt/data
        bind:
          create_host_path: false
    ports:
      # ⚠️ TOUJOURS préfixé par 127.0.0.1 (vérifié par la CI) : accès par tunnel SSH
      #   ssh -N -L 8088:127.0.0.1:8088 <utilisateur>@<serveur>
      - "127.0.0.1:${VEILLE_UI_PORT:-8088}:8088"
    command: ["gateway", "run"]
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
