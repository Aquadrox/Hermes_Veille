# Montées de version des dépendances.
#
# Règle du dépôt : chaque merge sur main = une nouvelle version (VERSION + CHANGELOG).
# Les PR Dependabot ne modifient pas VERSION : on ne les merge pas telles quelles. Elles
# servent de SIGNAL. Leur contenu est repris dans la prochaine branche release/vX.Y.Z
# (make bump), puis la PR Dependabot se ferme d'elle-même. Pour limiter le bruit :
# une seule PR groupée par écosystème et par mois.
version: 2
updates:
  - package-ecosystem: docker          # image amont Hermes (FROM du Dockerfile)
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      # Anciennes étiquettes datées (v2026.9.24 = Hermes v0.21.5) : vues comme plus récentes que v0.22.x.
      - dependency-name: "nousresearch/hermes-agent"
        versions: [">= 2000"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip             # requirements-app.txt / requirements-dev.txt
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
