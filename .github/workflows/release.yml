name: release

# À chaque merge sur main : si la version du fichier VERSION n'a pas encore d'étiquette,
# crée l'étiquette vX.Y.Z et la release GitHub avec la section correspondante du CHANGELOG.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier la version
        run: ./scripts/check-version.sh

      - name: Étiquette et release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "étiquette $TAG déjà présente — rien à publier"
            exit 0
          fi
          # Notes : la section du CHANGELOG entre « ## [VERSION] » et la section suivante.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
          echo "### Release $TAG publiée" >> "$GITHUB_STEP_SUMMARY"
