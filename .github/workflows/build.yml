name: build

# Construit et publie l'image dérivée sur GitHub Container Registry (ghcr.io).
# L'image amont (nousresearch/hermes-agent) est tirée à la construction ;
# on peut donc mettre à jour la veille en réémettant ce workflow.

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # Reconstruction hebdomadaire (lundi 04:00 UTC) pour récupérer les
    # correctifs de l'image amont Hermes.
    - cron: "0 4 * * 1"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hermes-veille

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer les étiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Construire et pousser
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            HERMES_BASE=nousresearch/hermes-agent:latest

      - name: Résumé
        run: |
          {
            echo "### Image publiée"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
