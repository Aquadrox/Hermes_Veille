name: build

# Tests, puis construction de l'image dérivée, smoke test sur l'image construite,
# et SEULEMENT ensuite publication sur GitHub Container Registry (ghcr.io).
# L'image amont est épinglée dans le Dockerfile : ses montées de version arrivent
# par Dependabot (PR), validées par ce même workflow.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Reconstruction hebdomadaire (lundi 04:00 UTC) : correctifs des paquets Debian.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: pip install -r requirements-app.txt pytest httpx ruff shellcheck-py

      - name: Lint (ruff + shellcheck)
        run: |
          ruff check .
          shellcheck scripts/*.sh docker/cont-init.d/50-seed-veille docker/s6-rc.d/veille-ui/run docker/s6-rc.d/veille-ui/finish docker/bin/veillectl

      - name: Interface publiée sur 127.0.0.1 uniquement
        run: |
          # Toute publication de port doit être préfixée par 127.0.0.1 (accès par tunnel SSH).
          if grep -nE '^\s*-\s*"?[0-9$]' docker-compose.yml | grep -v '127.0.0.1:'; then
            echo "::error file=docker-compose.yml::port publié hors de 127.0.0.1"; exit 1
          fi

      - name: Tests unitaires
        run: python -m pytest -q tests

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Nom d'image
        # Docker exige un nom en minuscules (le propriétaire du dépôt est « Aquadrox »).
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hermes-veille" >> "$GITHUB_ENV"

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Calculer les étiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Construire (chargée localement, pas encore poussée)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test de l'image
        run: IMAGE=${{ env.IMAGE }} IMAGE_TAG=ci ./scripts/smoke-test.sh

      - name: Se connecter à ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pousser l'image testée
        if: github.event_name != 'pull_request'
        run: |
          while read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "$IMAGE:ci" "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Résumé
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Image publiée"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
