name: ci

# Qualité et tests à chaque push et pull request — rapide, sans construire l'image.
# La construction de l'image, le smoke test et le test d'intégration sont dans image.yml.

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Version (VERSION, CHANGELOG, branche)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Cohérence de la version
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          # PR : comparée à la branche cible ; branche de version : comparée à main.
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (startsWith(github.ref_name, 'release/') && 'origin/main' || '') }}
        run: ./scripts/check-version.sh

  lint:
    name: Lint (ruff, shellcheck, hadolint, compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check --output-format=github .
      - name: shellcheck
        run: shellcheck scripts/*.sh docker/cont-init.d/50-seed-veille docker/s6-rc.d/veille-ui/run docker/s6-rc.d/veille-ui/finish docker/bin/*
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: docker compose config
        run: cp .env.example .env && docker compose config --quiet
      - name: Ports publiés sur 127.0.0.1 uniquement
        run: |
          # Toute publication de port doit être préfixée par 127.0.0.1 (accès par tunnel SSH).
          if grep -nE '^\s*-\s*"?[0-9$]' docker-compose.yml | grep -v '127.0.0.1:'; then
            echo "::error file=docker-compose.yml::port publié hors de 127.0.0.1"; exit 1
          fi

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 : python3 d'un hôte Debian 12 (chien de garde) ; 3.13 : celui de l'image.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pandoc + WeasyPrint (test réel de la chaîne PDF)
        if: matrix.python == '3.13'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pandoc weasyprint fonts-dejavu-core
      - name: pytest
        run: |
          python -m pytest -q --junitxml=junit.xml \
            --cov=veille_core --cov=veille_ui --cov-report=term --cov-report=xml --cov-fail-under=75
      - name: Résumé de couverture
        if: always() && matrix.python == '3.13'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          print(f"### Couverture : {float(root.get('line-rate')) * 100:.1f} %\n")
          print("| Module | Lignes |\n|---|---|")
          for pkg in root.iter("package"):
              print(f"| {pkg.get('name')} | {float(pkg.get('line-rate')) * 100:.0f} % |")
          PY
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python == '3.13'
        with:
          name: rapports-de-test
          path: |
            junit.xml
            coverage.xml

  audit:
    name: Audit des dépendances (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.10.0
      - run: pip-audit --requirement requirements-app.txt --desc
